<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Courses Practical Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        .login-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            text-align: center;
        }

        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: white;
        }

        .login-card p {
            margin-bottom: 2rem;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Editor Portal</h2>
            <p>Please enter your credentials to manage courses.</p>

            <div id="error-box" class="error-message">Invalid email or password.</div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1.5rem;">Sign In</button>
            </form>

            <a href="index.html"
                style="margin-top: 2rem; display: block; font-size: 0.85rem; color: var(--text-secondary);">← Back to
                home</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (data.user) {
                window.location.href = 'admin.html';
            } else {
                errorBox.style.display = 'block';
                errorBox.innerText = error.message;
            }
        });
    </script>
</body>

</html>
